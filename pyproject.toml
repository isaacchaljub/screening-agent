[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-agent"
version = "0.1.0"
description = "Conversational candidate-screening agent for Grupo Sazón."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "APScheduler>=3.10",
    "chromadb>=0.5",
    "SQLAlchemy>=2.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    # Local, in-process embeddings (llm/providers/local.py). Pulls torch, which is by far the
    # heaviest dependency here — the trade is argued in README "Local embeddings".
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that are *source*, not documentation, and so must land in site-packages.
# `packages.find` only collects importable packages, so without this a non-editable install
# (i.e. the Docker image) silently ships without them: `api.py`'s `WEB_DIR.exists()` guard goes
# false and the chat UI 404s, and `rag/index.py` finds no FAQ to embed. Neither shows up in
# development, because `pip install -e .` resolves both straight out of the source tree.
[tool.setuptools.package-data]
screening_agent = ["web/*", "rag/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real vendor API; skipped unless the relevant key is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
